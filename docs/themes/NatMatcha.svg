  <g transform="translate(20,16)" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Noto Sans TC',sans-serif">
    <rect width="300" height="296" rx="12" fill="#F7F2E5" stroke="#D9CFB6" stroke-width="1" filter="url(#s)"/>
