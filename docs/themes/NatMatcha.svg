<svg xmlns="http://www.w3.org/2000/svg" width="308" height="284" viewBox="0 0 308 284" role="img" aria-label="Nat Matcha 主題預覽">
  <title>Nat Matcha</title>
  <defs><filter id="s" x="-25%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.19"/></filter></defs>
  <g transform="translate(20,16)" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Noto Sans TC',sans-serif">
    <rect width="268" height="240" rx="10" fill="#F7F2E5" stroke="#D9CFB6" stroke-width="1" filter="url(#s)"/>
