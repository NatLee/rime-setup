# bopomo_onionplus_space.custom.yaml
patch:
  # ── 八股文語言模型（octagram）：提升整句連打準確度 ──
  # 模型檔：zh-hant-t-essay-bgw.gram（置於使用者資料夾）
  grammar:
    language: zh-hant-t-essay-bgw
    collocation_max_length: 5
    collocation_min_length: 2
  "translator/contextual_suggestions": true
  "translator/max_homophones": 7
  "translator/max_homographs": 7

  # ── 外掛語言體驗補強：打一半就顯示整個詞（自動補全）──
  # 韓文（korea）維持關閉：音節制編碼開補全會產生大量雜訊（原生方案同樣關閉）
  "japan/enable_completion": true
  "european/enable_completion": true
  "gr2/enable_completion": true
  "cyr2/enable_completion": true

  # ── 候選釋義（中／英／日 三語可切換，lua gloss_filter）──
  # 日文段落（前綴 6）查三語日文釋義詞典；easy_en 段落（前綴 3）查 easy_en_lcomment。
  # 三個釋義詞典掛入 dependencies 使其隨本方案編譯
  "schema/dependencies/+":
    - jpnin1_gloss
    - jpnin1_gloss_zh
    - jpnin1_gloss_ja
  # 整列覆蓋原生 engine/filters：
  #  ‧ 移除 reverse_lookup_filter@e_reverse_lookup（職責併入 gloss_filter）
  #  ‧ gloss_filter 置於列尾（原 jp_gloss 附加位置）：
  #    － 在 en_sort_filter 之後（其 revise_comment_by_os 於 Windows 會去除
  #      comment 換行，先跑會破壞兩行排版）
  #    － 在 convert_english/japan_filter 之後（保留 simp_en 標籤、
  #      使 simp_jp 假名轉換候選也能被釋義）
  "engine/filters":
    - simplifier@character_range_bhjm
    - lua_filter@mix_cf2_miss_filter
    - lua_filter@en_sort_filter
    - lua_filter@convert_english_filter
    - lua_filter@convert_japan_filter
    - simplifier@emoji_switch
    - simplifier@zh_cn
    - simplifier@back_mark
    - simplifier@punct_mark
    - reverse_lookup_filter@bpm_reverse_lookup
    - uniquifier
    - lua_filter@comment_filter_unicode
    - lua_filter@gloss_filter
  # 釋義語言 radio 開關（reset: 0 = 預設 gloss_zh 中文）
  "switches/+":
    - options: [ gloss_zh, gloss_en, gloss_ja ]
      states: [ 釋中, 釋英, 釋日 ]
      reset: 0

  # ── Shift+數字 選字 ──
  # 數字鍵本身是注音編碼，故用 Shift+1~6（!@#$%^）作選字鍵；標籤顯示 1.~6.
  "menu/alternative_select_keys": "!@#$%^"
  "menu/alternative_select_labels": [ "⇧1", "⇧2", "⇧3", "⇧4", "⇧5", "⇧6" ]
  # ── 開發者小工具（'/ts 時間戳、'/uuid、'/pw 密碼、'/rgb 色碼、'/cs 命名風格）──
  # devkit_translator 掛在 mf_translator 之後，共用「'/」段落
  "engine/translators":
    - punct_translator
    - lua_translator@lua_custom_phrase
    - table_translator@emoji_series
    - script_translator@reverse2_lookup
    - table_translator@easy_en
    - table_translator@easy_en_upper
    - script_translator@european
    - script_translator@japan
    - script_translator@korea
    - script_translator@fs2
    - script_translator@gr2
    - script_translator@cyr2
    - script_translator@all_bpm
    - lua_translator@mf_translator
    - lua_translator@devkit_translator
    - lua_translator@email_url_translator
    - lua_translator@instruction_grave_bpmf
    - script_translator

  # selector 移到 punctuator 之前：選單開啟時 Shift+數字先被選字器處理；
  # 無選單時 selector 不動作，Shift+1 照常輸出「！」
  "engine/processors":
    - lua_processor@mix_apc_ltk_pluss
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - selector
    - punctuator
    - navigator
    - express_editor
