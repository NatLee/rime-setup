# Rime schema settings
# encoding: utf-8
# 《反查掛載專用 日翻英 設定頁》
schema:
  schema_id: jpnin1_gloss
  name: "提示碼_日翻英"
  version: "20260825"
  author:
    - Onion
  description: |
    只在反查掛載作用（讓 jpnin1_gloss.dict.yaml 被編譯）

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]

engine:
  filters:
    # - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - echo_translator
    - table_translator

speller:
  alphabet: 'zyxwvutsrqponmlkjihgfedcba'
  delimiter: " "
  algebra:
    - erase/^.+$/  #縮小 prism 檔用（此方案不供輸入，只為編譯詞典）

translator:
  dictionary: jpnin1_gloss
  prism: jpnin1_gloss
  sentence_over_completion: false
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  enable_completion: false
  enable_user_dict: false

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
