# bopomo_onionplus.custom.yaml
patch:
  # ── 方案顯示名稱──
  "schema/name": "注音Na+"

  # ── 八股文語言模型（octagram）：提升整句連打準確度 ──
  # 模型檔：zh-hant-t-essay-bgw.gram（置於使用者資料夾）
  grammar:
    language: zh-hant-t-essay-bgw
    collocation_max_length: 5
    collocation_min_length: 2
  "translator/contextual_suggestions": true
  "translator/max_homophones": 7
  "translator/max_homographs": 7

  # ── 外掛語言體驗補強：打一半就顯示整個詞（自動補全）──
  # 韓文（korea）維持關閉：音節制編碼開補全會產生大量雜訊（原生方案同樣關閉）
  "japan/enable_completion": true
  "european/enable_completion": true
  "gr2/enable_completion": true
  "cyr2/enable_completion": true

  # ── 少用的前綴語言不開使用者詞庫（加快載入這個方案的速度）──
  # 每個開了使用者詞庫的 translator，載入方案時都要各開一個資料庫。主方案掛了九種前綴語言，
  # 光這一項就佔載入時間的四分之一左右 —— 每次切回注音、每開一個新視窗都要付一次。
  # 這五種（拉丁、希臘、俄文、全形、倉頡反查）用得少、候選也少，不記詞頻幾乎沒差別，關掉。
  # 日文（japan）、韓文（korea）、emoji 仍然會學習。各語言的獨立方案不受影響。
  "european/enable_user_dict": false
  "gr2/enable_user_dict": false
  "cyr2/enable_user_dict": false
  "fs2/enable_user_dict": false
  "reverse2_lookup/enable_user_dict": false
  # ── 英文段落提示標籤：《Easy》→《英》──
  # 用 /+ 附加一條改寫規則，不必複製原本的 preedit_format 列表
  "easy_en/tips": "《英》▶"
  "easy_en/closing_tips": "◀《英》"
  "easy_en/preedit_format/+":
    - xform/《Easy》/《英》/
  "easy_en_upper/preedit_format/+":
    - xform/《Easy》/《英》/

  # ── 候選釋義（中／英／日 三語可切換，lua gloss_filter）──
  # 日文段落（前綴 6）查三語日文釋義詞典；easy_en 段落（前綴 3）查 easy_en_lcomment。
  # 三個釋義詞典掛入 dependencies 使其隨本方案編譯
  "schema/dependencies/+":
    - jpnin1_gloss
    - jpnin1_gloss_zh
    - jpnin1_gloss_ja
  # 整列覆蓋原生 engine/filters：
  #  ‧ 移除 reverse_lookup_filter@e_reverse_lookup（職責併入 gloss_filter）
  #  ‧ gloss_filter 置於列尾（原 jp_gloss 附加位置）：
  #    － 在 en_sort_filter 之後（其 revise_comment_by_os 於 Windows 會去除
  #      comment 換行，先跑會破壞兩行排版）
  #    － 在 convert_english/japan_filter 之後（保留 simp_en 標籤、
  #      使 simp_jp 假名轉換候選也能被釋義）
  "engine/filters":
    - simplifier@character_range_bhjm
    - lua_filter@mix_cf2_miss_filter
    - lua_filter@en_sort_filter
    - lua_filter@convert_english_filter
    - lua_filter@convert_japan_filter
    - simplifier@emoji_switch
    - simplifier@zh_cn
    - simplifier@back_mark
    - simplifier@punct_mark
    - reverse_lookup_filter@bpm_reverse_lookup
    - uniquifier
    - lua_filter@comment_filter_unicode
    - lua_filter@gloss_filter
  # ── 開關清單整合：整列覆蓋，把原本看不懂的代號（🈚️／🄽／個排／完整）
  #    改成自我說明的名稱，F4 選單一目了然。順序＝選單顯示順序。
  #    （狀態記憶是依 option 名稱，改標籤不會遺失既有設定）
  switches:
    - name: ascii_mode
      reset: 0
      states: [ 中文, 英文 ]
    - name: full_shape
      reset: 0
      states: [ 半形, 全形 ]
    - name: ascii_punct
      reset: 0
      states: [ 中文標點, 英文標點 ]
    - name: simplification
      reset: 0
      states: [ 正體, 簡體 ]
    - name: character_range_bhjm
      reset: 1
      states: [ 完整字集, 台灣常用字 ]
    - name: emoji_segestion
      reset: { __include: "na_input:/emoji" } # 安裝選項（預設 1），見 na_input.yaml
      states: [ 不附 emoji, 附 emoji ]
    - name: back_mark
      reset: 1
      states: [ 不標註符號, 標註符號 ]
    - name: punct_mark
      reset: 1
      states: [ 不標註標點, 標註標點 ]
    - name: unicode_comment
      reset: 0
      states: [ 不顯編碼, 顯 Unicode 編碼 ]
    - name: en_sort
      reset: 0
      states: [ 英文：預設排序, 英文：字母序 ]
    - options: [ gloss_zh, gloss_en, gloss_ja ]
      reset: { __include: "na_input:/gloss" } # 安裝選項（預設 0＝中文）
      states: [ 釋義：中文, 釋義：英文, 釋義：日文 ]

  # ── 補綁被 Windows 攔截的快捷鍵 ──
  # Ctrl+Shift+0 被 Windows 註冊為「直接切換輸入法」系統熱鍵（登錄檔
  # Control Panel\Input Method\Hot Keys 的 00000104），永遠傳不到輸入法，
  # 故 en_sort 改用 F 區（F 區沒有被系統佔用）。
  "key_binder/bindings/+":
    - { accept: "Control+Shift+F5", toggle: en_sort, when: always }

  # ── Shift+數字 選字（數字鍵本身是注音編碼，故用 Shift+1~6）──
  # 選字鍵字串給 lua_processor@p_select_keys 用（順便給 p_run_files 的選單共用），
  # ⚠ 這裡**故意不設** menu/alternative_select_keys —— 設了 macOS 的標籤就壞：
  #   librime 選字鍵與標籤兩份資料都交給前端，但取用優先序兩邊相反 ——
  #   小狼毫先看 labels、鼠鬚管先看 select_keys，於是 macOS 的標籤永遠是 !@#$%^。
  #   → select_keys 留空（前端只剩 labels 可用），選字改由 p_select_keys 做。
  #   完整原委見 lua/processor_p_select_keys.lua 開頭與 docs/GOTCHAS.md。
  "p_select_keys/keys": "!@#$%^"
  # ⚠ 標籤數量必須 ≥ menu/page_size（6），否則 librime 根本不填 select_labels，
  #   兩邊前端都會退回顯示選字鍵／流水號。
  "menu/alternative_select_labels": [ "⇧1", "⇧2", "⇧3", "⇧4", "⇧5", "⇧6" ]
  # ── 開發者小工具（'/ts 時間戳、'/uuid、'/pw 密碼、'/rgb 色碼、'/cs 命名風格）──
  # devkit_translator 掛在 mf_translator 之後，共用「'/」段落
  "engine/translators":
    - punct_translator
    - lua_translator@lua_custom_phrase
    - table_translator@emoji_series
    - script_translator@reverse2_lookup
    - table_translator@easy_en
    - table_translator@easy_en_upper
    - script_translator@european
    - script_translator@japan
    - script_translator@korea
    - script_translator@fs2
    - script_translator@gr2
    - script_translator@cyr2
    - script_translator@all_bpm
    - lua_translator@mf_translator
    - lua_translator@devkit_translator
    - lua_translator@email_url_translator
    - lua_translator@instruction_grave_bpmf
    - script_translator

  # ── processor 鏈順序（順序就是攔截優先權，改動前先讀完這段）──
  # selector 在 punctuator 之前：選單開啟時選字鍵先給選字器處理；
  # 無選單時 selector 不動作，Shift+1 照常輸出「！」。
  #
  # p_run_files 排在**最前面**，'/ 系列的「選中即執行」才會生效：
  #   ‧ 要在 mix_apc_s2rm_ltk 之前 —— 否則空白／Enter 先被它 confirm 上屏，
  #     選單只會吐出候選文字本身（'/dt、'/jh 這種字面字串）。
  #   ‧ 要在 p_select_keys／selector 之前 —— 否則 ⇧1~6 先被拿去選字上屏，症狀同上。
  #   ‧ 要在 speller／express_editor 之前 —— 否則按鍵先被拿去組字或直接上屏。
  #
  # p_select_keys（⇧1~6 選字）排在 recognizer 之後、speller/selector 之前：
  #   ‧ 在 recognizer **之後** —— '@' 要先讓 email 樣式接走，否則打不出信箱。
  #   ‧ 在 speller/selector/punctuator **之前** —— 才選得到字、'!' 不會先變「！」。
  #   ‧ 不能用 key_binder 轉 KP_1~KP_6 代替：mix_apc_s2rm_ltk 會把 KP_n 當成
  #     「小鍵盤打數字」塞進 '/ 計算機的輸入，選字反而失效。
  # ⚠ 元件名 p_run_files／p_select_keys 必須在 rime.lua 有 bind（`x = require(...)`），
  #   否則這幾行等於沒寫：librime-lua 建不出元件，整段功能靜默失效。
  # schema_cycle（單按右 Shift 循環切換語言）放最前面：它只認右 Shift，其他鍵一律放行。
  "engine/processors":
    - lua_processor@schema_cycle
    - lua_processor@p_run_files
    - lua_processor@mix_apc_s2rm_ltk
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@p_select_keys
    - speller
    - selector
    - punctuator
    - navigator
    - express_editor
