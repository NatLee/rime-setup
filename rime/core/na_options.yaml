# na_options.yaml — 安裝選項的「預設值」
#
# ⚠ 不要改這個檔。要換選項請重跑安裝腳本（README「安裝」那一行指令），
#   它會把你的選擇寫進 na_options.custom.yaml（已被 .gitignore 排除，
#   每台機器各自一份，更新設定時不會被覆蓋、也不會被提交）。
#   想手動改也可以，直接編輯 na_options.custom.yaml 後重新部署：
#
#     patch:
#       theme: NatLight
#       emoji: 0
#
# 運作方式：各 *.custom.yaml 在需要的位置寫 `__include: na_options:/<鍵>`
# 取值；RIME 編譯本檔時會自動套上 na_options.custom.yaml 的 patch
# （和 default.yaml ← default.custom.yaml 是同一套機制）。

# ── 主題（候選窗配色）──
# NatMatcha 抹茶奶油｜NatLight 明亮｜NatDark 深色｜NatLee 經典
# 配色定義在 weasel.custom.yaml（Windows）／squirrel.custom.yaml（macOS）
theme: NatMatcha
theme_dark: NatDark # 系統深色模式時用的主題（預設跟隨系統換成深色）。不想跟隨：在個人檔寫 theme_dark: ~
# ⚠ 「不跟隨」不要寫成跟 theme 同一個名稱 —— 那會把深色模式釘死在那個主題，
#   之後從小狼毫自己的「輸入法設定」換配色，在深色模式下會沒反應。

# ── 字級（pt）──
# 標籤與註釋共用 label_font_point，比候選字小一截，候選字才突出。
font_point: 17 # Windows：候選字
label_font_point: 13 # Windows：標籤與註釋
mac_font_point: 21 # macOS：候選字（同樣的 pt 在 Mac 上看起來比較小，所以大兩級）
mac_label_font_point: 15 # macOS：標籤與註釋

# ── 候選排列 ──
horizontal: false # Windows：true 橫排／false 直排
candidate_list_layout: stacked # macOS：linear 橫排／stacked 直排

# ── 打字時候選附帶 emoji（1 開／0 關）──
# 只是「預設狀態」，隨時可在方案選單（Ctrl+` 或 F4）切換
emoji: 1

# ── 候選釋義預設語言（0 中文／1 英文／2 日文）──
gloss: 0

# ── 方案選單要出現哪些輸入方案（順序＝選單編號）──
# 第一個必須是 bopomo_onionplus（主方案）
schema_list:
  - { schema: bopomo_onionplus } # 注音Na+
  - { schema: jpnin1 } # 日文
  - { schema: hangeul_hnc } # 韓文
  - { schema: easy_en_lower } # 英文
  - { schema: allbpm } # 注音文
  - { schema: fullshape } # 全形
  - { schema: easy_en_upper } # 英文（大寫）
  - { schema: easy_en_lcomment } # 英文（附釋義）
  - { schema: symbols_bpmf } # 符號
