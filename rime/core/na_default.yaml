# na_default.yaml — 全域設定（快捷鍵、方案清單、中英切換鍵）：這套設定要對 default.yaml 做的 patch
#
# 為什麼不叫 default.custom.yaml：那個檔是「使用者的」。小狼毫的「方案選單設定」對話框會把
# 勾選的方案寫進去，而且每次都把整個檔重寫。repo 的內容如果也放在那裡，下次更新一複製就把
# 使用者在對話框的選擇蓋掉。所以 repo 的內容放這個檔，使用者資料夾的 default.custom.yaml 只有一行
#
#     patch:
#       __include: na_default:/patch
#
# 由 scripts/rime-apply.* 在第一次套用時建立，之後永遠不覆蓋。寫在那一行底下的鍵會蓋過這裡的值
# （對話框選的方案清單就是這樣生效的），想自己加設定也寫在那裡。原委見 docs/GOTCHAS.md
# 「小狼毫設定對話框與 *.custom.yaml」。
patch:
  # false＝小狼毫接管 Caps 鍵：按下只切換中英、不點亮 LED。
  # 修正「LED 亮著時被強制英文、Shift 切回中文又馬上彈回英文」（weasel issue #1736）
  "ascii_composer/good_old_caps_lock": false
  "ascii_composer/switch_key":
    Caps_Lock: commit_code
    Control_L: noop
    Control_R: noop
    Shift_L: commit_code
    Shift_R: noop # 右 Shift 留給「循環切換語言」（lua_processor@schema_cycle），不切中英
  "key_binder/bindings":
    - {accept: "Control+p", send: Up, when: composing}
    - {accept: "Control+n", send: Down, when: composing}
    - {accept: "Control+b", send: Left, when: composing}
    - {accept: "Control+f", send: Right, when: composing}
    - {accept: "Control+a", send: Home, when: composing}
    - {accept: "Control+e", send: End, when: composing}
    - {accept: "Control+d", send: Delete, when: composing}
    - {accept: "Control+k", send: "Shift+Delete", when: composing}
    - {accept: "Control+h", send: BackSpace, when: composing}
    - {accept: "Control+g", send: Escape, when: composing}
    - {accept: "Alt+v", send: Page_Up, when: composing}
    - {accept: "Control+v", send: Page_Down, when: composing}
    - {accept: ISO_Left_Tab, send: "Shift+Left", when: composing}
    - {accept: "Shift+Tab", send: "Shift+Left", when: composing}
    - {accept: Tab, send: "Shift+Right", when: composing}
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: comma, send: Page_Up, when: paging}
    - {accept: period, send: Page_Down, when: has_menu}
    - {accept: "Control+Shift+1", select: .next, when: always}
    - {accept: "Control+Shift+2", toggle: ascii_mode, when: always}
    - {accept: "Control+Shift+3", toggle: full_shape, when: always}
    - {accept: "Control+Shift+4", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+5", toggle: simplification, when: always}
    - {accept: "Control+Shift+6", toggle: extended_charset, when: always}
    - {accept: "Control+Shift+exclam", select: .next, when: always}
    - {accept: "Control+Shift+at", toggle: ascii_mode, when: always}
    - {accept: "Control+Shift+numbersign", toggle: full_shape, when: always}
    - {accept: "Control+Shift+dollar", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+percent", toggle: simplification, when: always}
    - {accept: "Control+Shift+asciicircum", toggle: extended_charset, when: always}
    - {accept: "Shift+space", toggle: ascii_mode, when: always}
    - {accept: "Control+comma", toggle: ascii_mode, when: always}
    # ── 一鍵切換語言方案（長文用原生體驗；短句用 3/4/6/7 前綴即可）──
    # 編號對應 F4 選單順序；Ctrl+Alt 是 Windows AltGr 保留組合小狼毫不轉送，
    # Ctrl+Shift+字母 易與 VSCode 等衝突、Ctrl+Shift+6~0 被方案內建的開關佔用，故用 Ctrl+Shift+F 區
    - {accept: "Control+Shift+F1", select: bopomo_onionplus, when: always}
    - {accept: "Control+Shift+F2", select: jpnin1, when: always}
    - {accept: "Control+Shift+F3", select: hangeul_hnc, when: always}
    - {accept: "Control+Shift+F4", select: easy_en_lower, when: always}
    # macOS 備援：Mac 的 F1~F4 預設是亮度／調度中心等媒體鍵，即使按住修飾鍵也不會
    # 傳到輸入法（除非在「系統設定 → 鍵盤」開啟標準功能鍵）。Ctrl+Opt 在 Windows
    # 等同 AltGr、小狼毫本來就不轉送，兩邊並存不會互相干擾。
    - {accept: "Control+Alt+1", select: bopomo_onionplus, when: always}
    - {accept: "Control+Alt+2", select: jpnin1, when: always}
    - {accept: "Control+Alt+3", select: hangeul_hnc, when: always}
    - {accept: "Control+Alt+4", select: easy_en_lower, when: always}
    - {accept: "Control+period", toggle: full_shape, when: always}
    - {accept: "Control+semicolon", toggle: simplification, when: always}
    - {accept: "Control+slash", toggle: ascii_punct, when: always}
  # 方案清單是安裝選項（裝哪些語言），預設值與說明見 na_menu.yaml；
  # 個人選擇由安裝腳本寫進 na_menu.custom.yaml；在小狼毫「方案選單設定」對話框勾選的
  # 則寫在使用者資料夾的 default.custom.yaml，會蓋過這裡（見檔頭）。順序即 F4 選單編號。
  # ⚠ Ctrl+Shift+F1~F4 直達鍵寫死方案 id，不隨這份清單變動。
  schema_list: { __include: "na_menu:/schema_list" }
  # 單按右 Shift 循環切換語言（lua_processor@schema_cycle）時要跳過的方案：
  # 偶爾才用的不排進循環，否則要按很多下才繞得回注音。它們仍可從方案選單（Ctrl+`）選。
  schema_cycle:
    skip: [ allbpm, fullshape, easy_en_upper, easy_en_lcomment, symbols_bpmf ]
  "switcher/fix_schema_list_order": true
  "switcher/hotkeys":
    - "Control+grave"
    - "Control+Shift+grave"
    - F4
  us_keyboard_layout: true