      hilited_candidate_text_color: 0xD6620F # 高亮候選文字：藍 #0F62D6
      hilited_candidate_label_color: 0xE08D5B # 高亮候選標籤：淺藍 #5B8DE0
      hilited_comment_text_color: 0xCF936A # 高亮候選註釋：灰藍 #6A93CF
      hilited_mark_color: 0xD6620F # 高亮候選前的小標記：藍 #0F62D6
      prevpage_color: 0xD6620F # 翻頁箭頭 <（還能往前翻時的顏色）
