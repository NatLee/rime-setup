# na_weasel.yaml — 小狼毫（Windows）的候選窗：配色定義、字型、排版。這套設定要對 weasel.yaml 做的 patch
# 小狼毫 0.17.4（支援 corner_radius / shadow / color_scheme_dark / 字型 fallback 與字重）
#
# 為什麼不叫 weasel.custom.yaml：那個檔是「使用者的」。小狼毫「輸入法設定」對話框換配色時會把
# 選擇寫進去，而且每次都把整個檔重寫。repo 的內容如果也放在那裡，下次更新一複製就把使用者選的
# 配色蓋掉。所以 repo 的內容放這個檔，使用者資料夾的 weasel.custom.yaml 只有一行
#
#     patch:
#       __include: na_weasel:/patch
#
# 由 scripts/rime-apply.ps1 在第一次套用時建立，之後永遠不覆蓋。寫在那一行底下的鍵會蓋過這裡的值
# （對話框選的配色就是這樣生效的），想自己加設定也寫在那裡。原委見 docs/GOTCHAS.md
# 「小狼毫設定對話框與 *.custom.yaml」。

patch:
  app_options:
    cmd.exe:
      ascii_mode: true
    conhost.exe:
      ascii_mode: true
    openconsole.exe:
      ascii_mode: true
    windowsterminal.exe:
      ascii_mode: true
    mobaxterm.exe:
      ascii_mode: true

  style:
    # ↓ 配色、排列、字級是安裝選項：預設值在 na_style.yaml，個人選擇由安裝腳本寫進
    #   na_style.custom.yaml（打 '/setup 即可重選）。別在這裡直接寫死。
    color_scheme: { __include: "na_style:/theme" }
    color_scheme_dark: { __include: "na_style:/theme_dark?" } # 空值（~）＝深色模式也不換
    horizontal: { __include: "na_style:/horizontal" } # false 直排／true 橫排
    inline_preedit: false # FALSE 雙行顯示（編碼列在候選窗內）
    preedit_type: composition
    display_tray_icon: true
    # ── 候選窗的長相（設計說明見 docs/GOTCHAS.md「候選窗樣式」）──
    label_format: "%s" # 標籤只留「⇧1」，不加句點：少一個符號，候選字更乾淨
    mark_text: "" # 留空＝高亮那一列的左側畫一條圓角色條（顏色是配色裡的 hilited_mark_color）
    hover_type: semi_hilite # 滑鼠移到候選上會淡淡反白，知道點下去會選到哪個
    paging_on_scroll: true # 在候選窗上滾輪可以翻頁
    font_face: { __include: "na_style:/font_face" } # 安裝選項：粉圓體或系統字型（正黑粗體）
    font_point: { __include: "na_style:/font_point" } # 安裝選項（小 15／中 17／大 20）
    label_font_face: "Segoe UI Semibold, Segoe UI Symbol" # 後者確保 ⇧ 符號有字形
    label_font_point: { __include: "na_style:/label_font_point" } # 標籤縮小，候選字更突出
    comment_font_face: { __include: "na_style:/comment_font_face" } # 安裝選項，跟候選字同一套字型
    comment_font_point: { __include: "na_style:/label_font_point" } # 註釋與標籤一致
    layout:
      margin_x: 8 # 視窗左右內距
      margin_y: 6 # 視窗上下內距。小狼毫會把它撐到至少等於光棒的上下內距（hilite_padding_y）
      border_width: 1 # 細邊框（淺色主題在白底視窗上靠它跟背景分開）
      spacing: 6 # 編碼列與候選之間
      candidate_spacing: 2 # 候選列之間。光棒自己有上下內距，列距不必再大
      hilite_spacing: 8 # 標籤／候選字／註釋之間
      # 註解排版：候選字大、右側小字註解，過長自動折行成第二行
      max_width: 520 # 超過此寬度自動折行（0 = 不限制）
      min_width: 0 # 不設最小寬度：視窗跟著內容走，候選短就窄
      align_type: center # 標籤、候選字、註釋垂直置中對齊
      hilite_padding_x: 8 # 光棒比文字左右各寬出這麼多
      hilite_padding_y: 4 # 光棒比文字上下各高出這麼多
      corner_radius: 10 # 視窗圓角
      round_corner: 6 # 光棒圓角
      shadow_radius: 12 # 柔和的陰影、略往下偏，視窗像浮在畫面上
      shadow_offset_x: 0
      shadow_offset_y: 3
  preset_color_schemes:
    # 顏色格式為 0xBBGGRR（含透明度時 0xAABBGGRR）
    #
    # 翻頁箭頭 < >（編碼列右側，可以點）：配色同時有 prevpage_color 和 nextpage_color 才畫，顏色透明就不畫。
    # 每套配色最後那行 __patch 接安裝選項「翻頁提示」：開的時候 na_style:/weasel_paging 是空的、什麼都不改；
    # 關的時候安裝腳本在 na_style.custom.yaml 把它寫成兩個透明色（0x00000000），蓋掉上面的顏色。
    # ⚠ 新增一套配色也要加那行 __patch，否則那套配色關不掉箭頭。
    NatMatcha:
      name: Nat Matcha
      author: NatLee
      back_color: 0xE5F2F7 # 底色：柔和象牙白 #F7F2E5（不是純白，不刺眼）
      border_color: 0xB6CFD9 # 邊框：淡卡其 #D9CFB6
      shadow_color: 0x30000000 # 陰影：19% 黑
      text_color: 0x282E2F # 編碼列文字：深灰 #2F2E28
      hilited_text_color: 0x786607 # 編碼列高亮段文字：茶湯青 #076678
      hilited_back_color: 0xC8E3EB # 編碼列高亮段底色：深一階奶油 #EBE3C8
      label_color: 0x687F87 # 候選標籤：灰褐 #877F68
      candidate_text_color: 0x1D2223 # 候選字：近黑 #23221D（高對比）
      comment_text_color: 0x786607 # 註釋：茶湯青 #076678
      hilited_candidate_back_color: 0x6E5E06 # 高亮候選底色：深茶湯青光棒 #065E6E
      hilited_candidate_text_color: 0xF4FDFF # 高亮候選文字：奶油白 #FFFDF4（高對比）
      hilited_candidate_label_color: 0xE4E2C2 # 高亮候選標籤：淡青奶油 #C2E2E4
      hilited_comment_text_color: 0xE4E2C2 # 高亮候選註釋：淡青奶油 #C2E2E4
      hilited_mark_color: 0xF4FDFF # 高亮候選前的小標記：奶油白 #FFFDF4
      prevpage_color: 0x786607 # 翻頁箭頭 <（還能往前翻時的顏色）
      nextpage_color: 0x786607 # 翻頁箭頭 >
      __patch: na_style:/weasel_paging # 翻頁箭頭的開關（見上面 preset_color_schemes 的說明）

