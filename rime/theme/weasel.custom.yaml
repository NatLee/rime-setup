# weasel.custom.yaml
# 小狼毫 0.17.4（支援 corner_radius / shadow / color_scheme_dark / 字型 fallback 與字重）

patch:
  app_options:
    cmd.exe:
      ascii_mode: true
    conhost.exe:
      ascii_mode: true
    openconsole.exe:
      ascii_mode: true
    windowsterminal.exe:
      ascii_mode: true
    mobaxterm.exe:
      ascii_mode: true

  style:
    # ↓ 配色、排列、字級是安裝選項：預設值在 na_options.yaml，個人選擇由安裝腳本寫進
    #   na_options.custom.yaml（重跑安裝指令即可重選）。別在這裡直接寫死。
    color_scheme: { __include: "na_options:/theme" }
    color_scheme_dark: { __include: "na_options:/theme_dark?" } # 與上面相同＝深色模式也不換
    horizontal: { __include: "na_options:/horizontal" } # false 直排／true 橫排
    inline_preedit: false # FALSE 雙行顯示（編碼列在候選窗內）
    preedit_type: composition
    display_tray_icon: true
    label_format: "%s."
    font_face: "Microsoft JhengHei:bold, Segoe UI Emoji" # bold＝字重加粗；後者為 emoji fallback
    font_point: { __include: "na_options:/font_point" } # 安裝選項（小 15／中 17／大 20）
    label_font_face: "Segoe UI Semibold, Segoe UI Symbol" # 後者確保 ⇧ 符號有字形
    label_font_point: { __include: "na_options:/label_font_point" } # 標籤縮小，候選字更突出
    comment_font_point: { __include: "na_options:/label_font_point" } # 註釋與標籤一致
    layout:
      margin_x: 12
      margin_y: 10
      border_width: 1 # 細邊框
      spacing: 10
      candidate_spacing: 8
      hilite_spacing: 6
      # 註解排版：候選字大、右側小字註解，過長自動折行成第二行
      max_width: 520 # 超過此寬度自動折行（0 = 不限制）
      min_width: 200
      align_type: top # 候選字與多行註解頂端對齊
      hilite_padding_x: 8
      hilite_padding_y: 6
      corner_radius: 10 # 視窗圓角
      round_corner: 6 # 高亮光棒圓角
      shadow_radius: 12 # 柔和陰影
      shadow_offset_x: 0
      shadow_offset_y: 2

  preset_color_schemes:
    # 顏色格式為 0xBBGGRR（含透明度時 0xAABBGGRR）
    NatMatcha:
      name: Nat Matcha
      author: NatLee
      back_color: 0xE5F2F7 # 底色：柔和象牙白 #F7F2E5（不是純白，不刺眼）
      border_color: 0xB6CFD9 # 邊框：淡卡其 #D9CFB6
      shadow_color: 0x30000000 # 陰影：19% 黑
      text_color: 0x282E2F # 編碼列文字：深灰 #2F2E28
      hilited_text_color: 0x786607 # 編碼列高亮段文字：茶湯青 #076678
      hilited_back_color: 0xC8E3EB # 編碼列高亮段底色：深一階奶油 #EBE3C8
      label_color: 0x687F87 # 候選標籤：灰褐 #877F68
      candidate_text_color: 0x1D2223 # 候選字：近黑 #23221D（高對比）
      comment_text_color: 0x786607 # 註釋：茶湯青 #076678
      hilited_candidate_back_color: 0x6E5E06 # 高亮候選底色：深茶湯青光棒 #065E6E
      hilited_candidate_text_color: 0xF4FDFF # 高亮候選文字：奶油白 #FFFDF4（高對比）
      hilited_candidate_label_color: 0xE4E2C2 # 高亮候選標籤：淡青奶油 #C2E2E4
      hilited_comment_text_color: 0xE4E2C2 # 高亮候選註釋：淡青奶油 #C2E2E4
      hilited_mark_color: 0xF4FDFF # 高亮候選前的小標記：奶油白 #FFFDF4

    NatLight:
      name: Nat Light
      author: NatLee
      back_color: 0xFEFCFA # 底色：微暖白 #FAFCFE
      border_color: 0xF0E9E4 # 邊框：淡灰藍 #E4E9F0
      shadow_color: 0x28000000 # 陰影：16% 黑
      text_color: 0x4F4137 # 編碼列文字：深灰 #37414F
      hilited_text_color: 0xD6620F # 編碼列高亮段文字：藍 #0F62D6
      hilited_back_color: 0xFEF1E9 # 編碼列高亮段底色：淡藍 #E9F1FE
      label_color: 0xABA198 # 候選標籤：淺灰 #98A1AB
      candidate_text_color: 0x3D3630 # 候選字：近黑 #30363D
      comment_text_color: 0x81776E # 註釋：中灰 #6E7781
      hilited_candidate_back_color: 0xFEF1E9 # 高亮候選底色：淡藍 #E9F1FE
      hilited_candidate_text_color: 0xD6620F # 高亮候選文字：藍 #0F62D6
      hilited_candidate_label_color: 0xE08D5B # 高亮候選標籤：淺藍 #5B8DE0
      hilited_comment_text_color: 0xCF936A # 高亮候選註釋：灰藍 #6A93CF
      hilited_mark_color: 0xD6620F # 高亮候選前的小標記：藍 #0F62D6

    # 深色主題（安裝時選「跟隨系統」會把它設成 color_scheme_dark）
    NatDark:
      name: Nat Dark
      author: NatLee
      back_color: 0x2B2320 # #20232B
      border_color: 0x3D332D # #2D333D
      shadow_color: 0x50000000
      text_color: 0xD8CEC8 # #C8CED8
      hilited_text_color: 0xF2A55C # #5CA5F2
      hilited_back_color: 0x40332B # #2B3340
      label_color: 0x8A7A6E # #6E7A8A
      candidate_text_color: 0xE4DBD5 # #D5DBE4
      comment_text_color: 0xA08D80 # #808DA0
      hilited_candidate_back_color: 0x4A3A2E # #2E3A4A
      hilited_candidate_text_color: 0xF5B075 # #75B0F5
      hilited_candidate_label_color: 0xD98F62 # #628FD9
      hilited_comment_text_color: 0xC08163 # #6381C0
      hilited_mark_color: 0xF2A55C # #5CA5F2

    # 櫻花：粉白底＋莓紅光棒
    NatSakura:
      name: Nat Sakura
      author: NatLee
      back_color: 0xF7F6FF # 底色 #FFF6F7
      border_color: 0xD3CDF2 # 邊框 #F2CDD3
      text_color: 0x38334A # 編碼列文字 #4A3338
      hilited_text_color: 0x6B45C2 # 編碼列高亮段文字 #C2456B
      hilited_back_color: 0xE8E3FB # 編碼列高亮段底色 #FBE3E8
      label_color: 0x938AB5 # 候選標籤 #B58A93
      candidate_text_color: 0x2E2A3B # 候選字 #3B2A2E
      comment_text_color: 0x6F56B5 # 註釋 #B5566F
      hilited_candidate_back_color: 0x7E57D9 # 高亮候選底色 #D9577E
      hilited_candidate_text_color: 0xFFFFFF # 高亮候選文字 #FFFFFF
      hilited_candidate_label_color: 0xE2D9FF # 高亮候選標籤 #FFD9E2
      hilited_comment_text_color: 0xECE6FF # 高亮候選註釋 #FFE6EC
