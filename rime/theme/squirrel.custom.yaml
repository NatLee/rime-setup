# squirrel.custom.yaml — macOS 鼠鬚管專用（樣式鍵與小狼毫不同，勿混用）
# 配色與 Windows 端 NatMatcha 同步
#
# ⚠ 為什麼全部寫成 "style/xxx" 這種路徑鍵，而不是巢狀的 style: 區塊？
#   RIME 的 patch 是「**整個節點取代**」，不是逐鍵合併。
#   寫成巢狀 `style:` 會把鼠鬚管內建 squirrel.yaml 的整個 style 節點蓋掉，
#   連同你沒寫的預設值一起消失 —— 其中就包含 candidate_format，
#   結果候選標籤退回內建 fallback，顯示成選字鍵 !@#$%^ 而不是 ⇧1～⇧6。
#   用路徑鍵才是逐鍵覆寫。詳見 docs/GOTCHAS.md。
#
# ⚠ 「標籤變成 !@#$%^」還有另一個更常見的原因，不在這個檔案：方案設了
#   menu/alternative_select_keys。鼠鬚管取標籤時 select_keys 優先於
#   select_labels（小狼毫相反），所以那個鍵一有值，Mac 就永遠顯示選字鍵本身。
#   → 本專案已改成不設它、選字交給 lua_processor@p_select_keys。詳見 docs/GOTCHAS.md。

patch:
  # ── 終端機類 App 預設英文（對應 Windows 端的 cmd/terminal 設定）──
  "app_options/com.apple.Terminal/ascii_mode": true
  "app_options/com.googlecode.iterm2/ascii_mode": true

  # ── 候選窗排版 ──
  # 內建預設就是 "[label]. [candidate] [comment]"，這裡明寫是為了不被上面那個
  # 節點取代問題咬到；[label] 會吃 menu/alternative_select_labels 的 ⇧1～⇧6。
  "style/candidate_format": "[label]. [candidate] [comment]"
  # ↓ 排列與配色是安裝選項：預設值在 na_options.yaml，個人選擇由安裝腳本寫進
  #   na_options.custom.yaml（重跑安裝指令即可重選）。別在這裡直接寫死。
  "style/candidate_list_layout": { __include: "na_options:/candidate_list_layout" } # stacked 直排／linear 橫排
  "style/text_orientation": horizontal
  "style/inline_preedit": false # 編碼列顯示在候選窗內（同 Windows）

  "style/color_scheme": { __include: "na_options:/theme" }
  "style/color_scheme_dark": { __include: "na_options:/theme_dark" } # 與上面相同＝深色模式也不換

  "style/corner_radius": 10 # 視窗圓角
  "style/hilited_corner_radius": 6 # 高亮光棒圓角
  "style/border_height": 4
  "style/border_width": 4
  "style/line_spacing": 5
  "style/spacing": 8

  # ── 字型 ──
  "style/font_face": "PingFangTC-Semibold" # 蘋方繁中・半粗（對應 Windows 端的正黑粗體）
  "style/font_point": 21 # 候選字；Windows 端是 17，Mac 這邊放大兩級
  "style/label_font_point": 15 # 標籤／註釋維持比候選字小一截的比例
  "style/comment_font_point": 15

  # ── 配色 ──
  # 同樣用路徑鍵逐項加入，才不會蓋掉鼠鬚管內建的 native/solarized 等配色。
  # 顏色格式為 0xBBGGRR。
  "preset_color_schemes/NatMatcha":
    name: Nat Matcha
    author: NatLee
    back_color: 0xE5F2F7 # 底色：柔和象牙白 #F7F2E5
    border_color: 0xB6CFD9 # 邊框：淡卡其 #D9CFB6
    text_color: 0x282E2F # 編碼列文字：深灰 #2F2E28
    hilited_text_color: 0x786607 # 編碼列高亮段文字：茶湯青 #076678
    hilited_back_color: 0xC8E3EB # 編碼列高亮段底色：深一階奶油 #EBE3C8
    label_color: 0x687F87 # 候選標籤：灰褐 #877F68
    candidate_text_color: 0x1D2223 # 候選字：近黑 #23221D
    comment_text_color: 0x786607 # 註釋：茶湯青 #076678
    hilited_candidate_back_color: 0x6E5E06 # 高亮候選底色：深茶湯青 #065E6E
    hilited_candidate_text_color: 0xF4FDFF # 高亮候選文字：奶油白 #FFFDF4
    hilited_candidate_label_color: 0xE4E2C2 # 高亮候選標籤：淡青奶油 #C2E2E4
    hilited_comment_text_color: 0xE4E2C2 # 高亮候選註釋：淡青奶油 #C2E2E4

  "preset_color_schemes/NatLight":
    name: Nat Light
    author: NatLee
    back_color: 0xFEFCFA # 底色：微暖白 #FAFCFE
    border_color: 0xF0E9E4 # 邊框：淡灰藍 #E4E9F0
    text_color: 0x4F4137 # 編碼列文字：深灰 #37414F
    hilited_text_color: 0xD6620F # 編碼列高亮段文字：藍 #0F62D6
    hilited_back_color: 0xFEF1E9 # 編碼列高亮段底色：淡藍 #E9F1FE
    label_color: 0xABA198 # 候選標籤：淺灰 #98A1AB
    candidate_text_color: 0x3D3630 # 候選字：近黑 #30363D
    comment_text_color: 0x81776E # 註釋：中灰 #6E7781
    hilited_candidate_back_color: 0xFEF1E9 # 高亮候選底色：淡藍 #E9F1FE
    hilited_candidate_text_color: 0xD6620F # 高亮候選文字：藍 #0F62D6
    hilited_candidate_label_color: 0xE08D5B # 高亮候選標籤：淺藍 #5B8DE0
    hilited_comment_text_color: 0xCF936A # 高亮候選註釋：灰藍 #6A93CF

  "preset_color_schemes/NatDark":
    name: Nat Dark
    author: NatLee
    back_color: 0x2B2320 # #20232B
    border_color: 0x3D332D # #2D333D
    text_color: 0xD8CEC8 # #C8CED8
    hilited_text_color: 0xF2A55C # #5CA5F2
    hilited_back_color: 0x40332B # #2B3340
    label_color: 0x8A7A6E # #6E7A8A
    candidate_text_color: 0xE4DBD5 # #D5DBE4
    comment_text_color: 0xA08D80 # #808DA0
    hilited_candidate_back_color: 0x4A3A2E # #2E3A4A
    hilited_candidate_text_color: 0xF5B075 # #75B0F5
    hilited_candidate_label_color: 0xD98F62 # #628FD9
    hilited_comment_text_color: 0xC08163 # #6381C0

  # 經典主題
  "preset_color_schemes/NatLee":
    name: Nat x Theme
    author: NatLee
    label_color: 0x36383c
    comment_text_color: 0x786607
    text_color: 0x454950
    candidate_text_color: 0x36383c
    back_color: 0xd7f5f9
    border_color: 0xd7f5f9
    hilited_text_color: 0x36383c
    hilited_back_color: 0xc7f1fb
    hilited_candidate_text_color: 0xc7f1fb
    hilited_candidate_label_color: 0xc7f1fb
    hilited_comment_text_color: 0xc7f1fb
    hilited_candidate_back_color: 0x786607
