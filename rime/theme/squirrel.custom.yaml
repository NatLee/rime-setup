# squirrel.custom.yaml — macOS 鼠鬚管專用（樣式鍵與小狼毫不同，勿混用）
# 配色與 Windows 端 NatMatcha 同步
#
# ⚠ 為什麼全部寫成 "style/xxx" 這種路徑鍵，而不是巢狀的 style: 區塊？
#   RIME 的 patch 是「**整個節點取代**」，不是逐鍵合併。
#   寫成巢狀 `style:` 會把鼠鬚管內建 squirrel.yaml 的整個 style 節點蓋掉，
#   連同你沒寫的預設值一起消失 —— 其中就包含 candidate_format，
#   結果候選標籤退回內建 fallback，顯示成選字鍵 !@#$%^ 而不是 ⇧1～⇧6。
#   用路徑鍵才是逐鍵覆寫。詳見 docs/GOTCHAS.md。
#
# ⚠ 「標籤變成 !@#$%^」還有另一個更常見的原因，不在這個檔案：方案設了
#   menu/alternative_select_keys。鼠鬚管取標籤時 select_keys 優先於
#   select_labels（小狼毫相反），所以那個鍵一有值，Mac 就永遠顯示選字鍵本身。
#   → 本專案已改成不設它、選字交給 lua_processor@p_select_keys。詳見 docs/GOTCHAS.md。

patch:
  # ── 終端機類 App 預設英文（對應 Windows 端的 cmd/terminal 設定）──
  "app_options/com.apple.Terminal/ascii_mode": true
  "app_options/com.googlecode.iterm2/ascii_mode": true

  # ── 候選窗排版 ──
  # 目標是跟 Windows 端（na_weasel.yaml）看起來一樣。兩個前端的鍵完全不同，下面每一行都標了
  # 它對應 Windows 的哪個設定；鍵名與行為對過鼠鬚管的原始碼（SquirrelTheme.swift／SquirrelView.swift）。
  # ⚠ 這份排版沒有在 Mac 上實際看過，數值是照原始碼的算法換算的，上機後可能要微調。
  #
  # 標籤不加句點（Windows：label_format "%s"）。明寫這個鍵也是為了不被檔頭講的「節點取代」咬到；
  # [label] 會吃 menu/alternative_select_labels 的 ⇧1～⇧6。
  "style/candidate_format": "[label] [candidate] [comment]"
  # ↓ 排列與配色是安裝選項：預設值在 na_style.yaml，個人選擇由安裝腳本寫進
  #   na_style.custom.yaml（打 '/setup 即可重選）。別在這裡直接寫死。
  "style/candidate_list_layout": { __include: "na_style:/candidate_list_layout" } # stacked 直排／linear 橫排
  "style/text_orientation": horizontal
  "style/inline_preedit": false # 編碼列顯示在候選窗內（同 Windows）

  "style/color_scheme": { __include: "na_style:/theme" }
  "style/color_scheme_dark": { __include: "na_style:/theme_dark?" } # 空值（~）＝深色模式也不換

  "style/corner_radius": 10 # 視窗圓角（Windows：layout/corner_radius 10）
  "style/hilited_corner_radius": 6 # 光棒圓角（Windows：layout/round_corner 6）
  # 視窗內距＝border_* ＋ corner_radius（鼠鬚管的算法），所以 1＋10＝11。這是鼠鬚管能做到的最小值，會比 Windows 的內距寬一點。
  # 兩者取小的那個同時是邊框線的粗細：1＝細邊框（Windows：layout/border_width 1）。
  "style/border_height": 1
  "style/border_width": 1
  "style/line_spacing": 5 # 候選列之間。光棒的高度是「文字＋這個值」，所以它同時決定光棒的上下內距
  "style/spacing": 6 # 編碼列與候選之間（Windows：layout/spacing 6）
  # 鼠鬚管內建的翻頁箭頭關掉：它寫死在程式裡，是兩個浮在候選窗「外面」左邊的小三角形，還會把整個候選窗
  # 往右推「標籤字級 ×1.5」（約 22px），候選窗就跟游標對不齊。位置、形狀、顏色都沒有鍵可以調，只能開或關。
  # 改用編碼列後面的「1 ›」「‹ 2 ›」「‹ 3」（lua/processor_paging_hint.lua；開關是下面的 na_paging_hint）。
  # 觸控板在候選窗上滑動照樣能翻頁。
  "style/show_paging": false
  # 翻頁提示的安裝選項。鼠鬚管不認得這個鍵，是給 lua/processor_paging_hint.lua 讀的。
  na_paging_hint: { __include: "na_style:/paging_hint" }
  # Windows 有、鼠鬚管沒有的：高亮列左側的圓角色條（mark）、滑鼠懸停反白的開關（鼠鬚管內建就會）。
  # 鼠鬚管的 shadow_size 是「光棒底下」的陰影，不是整個視窗的陰影，跟 Windows 的不是同一件事，所以不設。

  # ── 字型 ──
  "style/font_face": { __include: "na_style:/mac_font_face" } # 安裝選項：粉圓體或系統字型（蘋方半粗）
  "style/label_font_face": "PingFangTC-Medium" # 標籤：中等字重（Windows：Segoe UI Semibold）
  "style/comment_font_face": { __include: "na_style:/mac_comment_font_face" } # 安裝選項，跟候選字同一套字型
  # 字級是安裝選項（小 18／中 21／大 24）；同樣的 pt 在 Mac 上看起來比 Windows 小，所以大兩級
  "style/font_point": { __include: "na_style:/mac_font_point" }
  "style/label_font_point": { __include: "na_style:/mac_label_font_point" } # 標籤／註釋比候選字小一截
  "style/comment_font_point": { __include: "na_style:/mac_label_font_point" }
  # ── 配色 ──
  # 同樣用路徑鍵逐項加入，才不會蓋掉鼠鬚管內建的 native/solarized 等配色。
  # 顏色格式為 0xBBGGRR。
  "preset_color_schemes/NatMatcha":
    name: Nat Matcha
    author: NatLee
    back_color: 0xE5F2F7 # 底色：柔和象牙白 #F7F2E5
    border_color: 0xB6CFD9 # 邊框：淡卡其 #D9CFB6
    text_color: 0x282E2F # 編碼列文字：深灰 #2F2E28
    hilited_text_color: 0x786607 # 編碼列高亮段文字：茶湯青 #076678
    hilited_back_color: 0xC8E3EB # 編碼列高亮段底色：深一階奶油 #EBE3C8
    label_color: 0x687F87 # 候選標籤：灰褐 #877F68
    candidate_text_color: 0x1D2223 # 候選字：近黑 #23221D
    comment_text_color: 0x786607 # 註釋：茶湯青 #076678
    hilited_candidate_back_color: 0x6E5E06 # 高亮候選底色：深茶湯青 #065E6E
    hilited_candidate_text_color: 0xF4FDFF # 高亮候選文字：奶油白 #FFFDF4
    hilited_candidate_label_color: 0xE4E2C2 # 高亮候選標籤：淡青奶油 #C2E2E4
    hilited_comment_text_color: 0xE4E2C2 # 高亮候選註釋：淡青奶油 #C2E2E4

  "preset_color_schemes/NatLight":
    name: Nat Light
    author: NatLee
