# jpnin1.custom.yaml
patch:
  # 方案選單顯示名稱
  "schema/name": "日文"
  # 自動補全：打一半羅馬字即顯示完整詞（原版關閉）
  "translator/enable_completion": true

  # ── 候選釋義（中／英／日 三語可切換，lua gloss_filter）──
  # 三個釋義詞典掛入 dependencies 使其隨本方案編譯
  "schema/dependencies/+":
    - jpnin1_gloss
    - jpnin1_gloss_zh
    - jpnin1_gloss_ja
  # 原生 filters 只有 convert_japan_filter；gloss_filter 置於其後，
  # 使假名/羅馬字轉換候選（simp_jp）也能被釋義
  "engine/filters":
    - lua_filter@convert_japan_filter
    - lua_filter@gloss_filter
  # 釋義語言 radio 開關（reset 0／1／2 = 中／英／日；安裝選項，見 na_input.yaml）
  "switches/+":
    - options: [ gloss_zh, gloss_en, gloss_ja ]
      states: [ 釋中, 釋英, 釋日 ]
      reset: { __include: "na_input:/gloss" }
  # 單按右 Shift 循環切換語言：每個選單方案都要掛，而且要在最前面（見 lua/processor_schema_cycle.lua）
  "engine/processors/@before 0": lua_processor@schema_cycle
  # Mac 的翻頁提示（編碼列後面的「‹ 2 ›」；小狼毫上不作用）：每個選單方案都要掛，位置不拘（見 lua/processor_paging_hint.lua）
  "engine/processors/@next": lua_processor@paging_hint
